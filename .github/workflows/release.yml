# This workflow is used to release the fab-classic package to the expensify index.
# It uses "trusted publishing" which is a python index feature that allows for
# Github and other CI providers to self authenticate and publish packages to the index.
# See https://docs.cloudsmith.com/authentication/setup-cloudsmith-to-authenticate-with-oidc-in-github-actions
# for more information.
#
# The name of this file is important, it must be named release.yml as part of the trusted
# publishing setup, if you change the file name you will have to update the trusted publishing
# setup in Cloudsmith.
name: Release

# Only allow one release job to run at a time
# this prevents a race condition where two merges occur
# which causes two version bumps and then the releases
# being done out of order.
concurrency: release

# Create a release on any new tag which is a valid version number.
on:
  push:
    tags:
      - "*.*.*"

jobs:
  build:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read # for actions/checkout in private repos

    steps:
      - uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225 # v1.2.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@2ddd2b9cb38ad8efd50337e8ab201519a34c9f24 # v7.1.1

      - name: Build distributions
        run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dists
          path: dist/
          if-no-files-found: error

  publish:
    needs: [build]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read # for actions/checkout in private repos
      id-token: write # for Trusted Publishing to Cloudsmith

    # Deploy environment requires that certain conditions are met for this code to run.
    # These conditions are configured in the repo settings. This below string is also
    # used in the trusted publishing setup in Cloudsmith.
    environment: cloudsmith

    steps:
      # This checkout might seem useless but it lets the uv step below use the uv cache.
      - uses: useblacksmith/checkout@2d63ce5ba61677748c4e92f6eb578a8694226225 # v1.2.0
        with:
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: dists
          path: dist/

      - name: Set up uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Set up Cloudsmith CLI with OIDC
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e # v3.1.0
        with:
          oidc-namespace: "expensify"
          oidc-service-slug: "github-actions-uploader"
          export-auth-token: "true"

      - run: uv publish dist/*
        env:
          UV_PUBLISH_URL: "https://python.cloudsmith.io/expensify/prod/"
          UV_PUBLISH_USERNAME: "token"
          UV_PUBLISH_PASSWORD: ${{ env.CLOUDSMITH_API_KEY }}
